name: Prepare Netlify site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website source
        shell: bash
        run: |
          set -euo pipefail
          test -f code-self-admin-netlify.zip
          unzip -oq code-self-admin-netlify.zip -d /tmp/site
          cp -a /tmp/site/. .
          rm -f code-self-admin-netlify.zip kreato-fontstore-netlify-ready.zip README.validation.txt
          test -f index.html
          test -f netlify.toml
          test -d netlify/functions

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract deployable website source"
            git push
          fi
