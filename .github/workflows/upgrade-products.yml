name: Upgrade product listing fields

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upgrade-products.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source package if needed
        run: |
          set -e
          if [ ! -f admin/index.html ] && [ -f code-self-admin-netlify.zip ]; then
            unzip -oq code-self-admin-netlify.zip -d /tmp/site
            cp -a /tmp/site/. .
          fi
      - name: Upgrade product editor and public pricing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tick=chr(96)
          p=Path("admin/index.html")
          s=p.read_text()
          s=s.replace('<p class="small">Prices are stored in protected Netlify Blobs and are not included in the public catalog response.</p>','<p class="small">Add every product detail here. Product URL is the real Kreato listing URL. Price is shown publicly on the store.</p>')
          s=s.replace('<tr><th>Name</th><th>Slug</th><th>Price</th><th>Kreato URL</th><th>Published</th><th></th></tr>','<tr><th>Name</th><th>Slug</th><th>Short description</th><th>Description</th><th>Category</th><th>Tags</th><th>Price</th><th>Product URL</th><th>Thumbnail</th><th>Preview URLs</th><th>Alt text</th><th>Featured</th><th>Latest</th><th>Published</th><th></th></tr>')
          old = '''$('#product-rows').innerHTML=state.products.map((p,i)=>''' + tick + '''<tr data-i="${i}"><td><input data-k="name" value="${esc(p.name)}"></td><td><input data-k="slug" value="${esc(p.slug)}"></td><td><input data-k="price" value="${esc(p.price||'')}" placeholder="e.g. $12"></td><td><input data-k="kreatoUrl" value="${esc(p.kreatoUrl||'')}" placeholder="https://kreato.com/..."></td><td><input data-k="published" type="checkbox" ${p.published!==false?"checked":""}></td><td><button class="btn btn-secondary danger remove">Remove</button></td></tr>''' + tick + ''').join('');'''
          new = '''$('#product-rows').innerHTML=state.products.map((p,i)=>''' + tick + '''<tr data-i="${i}">
<td><input data-k="name" value="${esc(p.name)}"></td>
<td><input data-k="slug" value="${esc(p.slug)}"></td>
<td><textarea data-k="shortDescription" placeholder="Short product summary">${esc(p.shortDescription||'')}</textarea></td>
<td><textarea data-k="description" placeholder="Full product description">${esc(p.description||'')}</textarea></td>
<td><input data-k="category" value="${esc(p.category||'')}" placeholder="templates"></td>
<td><input data-k="tags" value="${esc((p.tags||[]).join(', '))}" placeholder="planning, creator"></td>
<td><input data-k="price" value="${esc(p.price||'')}" placeholder="₹499 / $12" inputmode="decimal"></td>
<td><input data-k="kreatoUrl" value="${esc(p.kreatoUrl||'')}" placeholder="https://kreato.com/..."></td>
<td><input data-k="thumbnail" value="${esc(p.thumbnail||'')}" placeholder="assets/images/..."></td>
<td><textarea data-k="previewImages" placeholder="One URL/path per line">${esc((p.previewImages||[]).join('\\n'))}</textarea></td>
<td><input data-k="altText" value="${esc(p.altText||'')}" placeholder="Product preview"></td>
<td><input data-k="featured" type="checkbox" ${p.featured?"checked":""}></td>
<td><input data-k="latest" type="checkbox" ${p.latest?"checked":""}></td>
<td><input data-k="published" type="checkbox" ${p.published!==false?"checked":""}></td>
<td><button class="btn btn-secondary danger remove">Remove</button></td>
</tr>''' + tick + ''').join('');'''
          if old not in s: raise SystemExit("admin render block not found")
          s=s.replace(old,new)
          s=s.replace("tr.querySelectorAll('[data-k]').forEach(el=>state.products[i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value);","""tr.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  if(el.type==='checkbox') state.products[i][k]=el.checked;
  else if(k==='tags') state.products[i][k]=el.value.split(',').map(x=>x.trim()).filter(Boolean);
  else if(k==='previewImages') state.products[i][k]=el.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  else state.products[i][k]=el.value.trim();
});""")
          s=s.replace("kreatoUrl:'',published:false,altText:'Product preview'","kreatoUrl:'',published:false,price:'',altText:'Product preview'")
          marker="if(p.published && !/^https:\/\/[^\s]+$/.test(u))"
          if marker in s:
            line=s.splitlines()
            for i,x in enumerate(line):
              if marker in x:
                line[i]="    if(p.published && !/^https:\/\/[^\s]+$/.test(u)) throw new Error('Add a valid HTTPS Product URL before publishing.');"
                line.insert(i+1,"    if(p.published && !String(p.price||'').trim()) throw new Error('Add a price before publishing.');")
                break
            s="\n".join(line)+"\n"
          p.write_text(s)
          p=Path("netlify/functions/admin.mjs")
          s=p.read_text()
          needle='''if (p.published) {
        try {'''
          repl='''if (p.published && !String(p.price || "").trim())
        return Response.json({error:"Published products need a price"},{status:400});
      if (p.published) {
        try {'''
          if needle in s: s=s.replace(needle,repl)
          p.write_text(s)
          p=Path("netlify/functions/catalog.mjs")
          p.write_text(p.read_text().replace('.map(({ price, ...safe }) => safe);','.map(p => p);'))
          p=Path("assets/js/app.js")
          p.write_text(p.read_text().replace('function formatPrice(){ return "See product page"; }','''function formatPrice(value){
  const v=String(value||"").trim();
  return v || "Price not set";
}'''))
          PY
      - name: Remove obsolete zip packages and commit
        run: |
          rm -f code-self-admin-netlify.zip kreato-fontstore-netlify-ready.zip README.validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add complete product listing fields and public prices" && git push)
